<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MarketCore</title>
	<link rel="icon" type="image/x-icon" href="marketcore.html">
c    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: #1e3c72;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }
        .navbar .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .nav-links a:hover {
            opacity: 1;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: white;
            color: #1e3c72;
        }
        .dashboard-container {
            display: flex;
            margin-top: 80px; /* space for fixed navbar */
            min-height: calc(100vh - 80px);
        }
        /* Sidebar */
        .sidebar {
            width: 80px; /* slightly wider to accommodate link */
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding: 2rem 0;
            position: fixed;
            top: 80px;
            bottom: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .categories-icon {
            font-size: 2rem;
            color: #444;
            cursor: default;
            padding: 0.5rem;
            transition: color 0.2s;
            position: relative;
        }
        .categories-icon:hover {
            color: #1e3c72;
        }
        .categories-icon:hover .categories-dropdown {
            display: block;
        }
        .categories-dropdown {
            display: none;
            position: absolute;
            left: 100%;
            top: 0;
            background: white;
            border: 1px solid #eef2f6;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 0.5rem 0;
            min-width: 200px;
            z-index: 200;
            margin-left: 10px;
        }
        .categories-dropdown a {
            padding: 0.5rem 1rem;
            white-space: nowrap;
            color: #444;
            text-decoration: none;
            display: block;
        }
        .categories-dropdown a:hover {
            background: #eef2f6;
            color: #1e3c72;
        }
        .sidebar-link {
            color: #444;
            text-decoration: none;
            font-size: 0.9rem;
            text-align: center;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            width: 100%;
        }
        .sidebar-link:hover {
            background: #eef2f6;
            color: #1e3c72;
        }
        /* Main content */
        .main-content {
            flex: 1;
            margin-left: 80px; /* match sidebar width */
            padding: 2rem;
        }
        .welcome-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            border-left: 6px solid #1e3c72;
        }
        .welcome-card h1 {
            font-size: 2rem;
            color: #1e3c72;
            margin-bottom: 0.5rem;
        }
        .welcome-card p {
            color: #555;
            margin-bottom: 0.5rem;
        }
        .role-badge {
            display: inline-block;
            background: #0b5e7c;
            color: white;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .module-card {
            background: white;
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            border: 1px solid #eef2f6;
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .module-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .module-card h3 {
            color: #1e3c72;
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
        }
        .module-card p {
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            flex-grow: 1;
        }
        .module-btn {
            background: #1e3c72;
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
            display: inline-block;
        }
        .module-btn:hover {
            background: #0b5e7c;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">MarketCore</a>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="products.html">See What's being sold</a>
            <a href="cart.html">Cart</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar with hamburger and link to categories page -->
        <div class="sidebar">

            <a href="categories.html" class="sidebar-link">☰</a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div id="welcomeCard" class="welcome-card" style="display: none;">
                <h1 id="welcomeMessage">Welcome back!</h1>
                <p id="userEmail"></p>
                <span id="roleBadge" class="role-badge"></span>
            </div>

            <h2 style="color: #1e3c72; margin-bottom: 1.5rem;">Your Modules</h2>
            <div id="loading" class="loading">Loading dashboard...</div>
            <div id="modulesContainer" class="modules" style="display: none;"></div>

            <div class="footer">
                &copy; 2026 MarketCore. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        // Module definitions (same as before)
        const modulesByRole = {
            buyer: [
                { icon: '🛒', title: 'Commodities', desc: 'Products from sellers', link: 'products.html' },
                { icon: '📦', title: 'My Orders', desc: 'Track your purchases and order history.', link: 'orders.html' },
                { icon: '❤️', title: 'Wishlist', desc: 'Items you\'ve saved for later.', link: 'wishlist.html' },
            ],
            seller: [
                { icon: '🛍️', title: 'Products', desc: 'Add, edit, or remove your products.', link: 'seller-products.html' },
                { icon: '📋', title: 'Orders', desc: 'View and fulfill customer orders.', link: 'seller-orders.html' },
            ],
            admin: [
                { icon: '👥', title: 'Manage Sellers', desc: 'Approve or suspend seller accounts.', link: 'admin-sellers.html' },
                { icon: '📂', title: 'Categories', desc: 'Manage product categories.', link: 'categories.html' },
                { icon: '📦', title: 'All Orders', desc: 'View all platform orders.', link: 'admin-orders.html' },
            ]
        };

        // Helper to add module cards
        function addModuleCard(icon, title, desc, link = null) {
            const container = document.getElementById('modulesContainer');
            const card = document.createElement('div');
            card.className = 'module-card';
            card.innerHTML = `
                <div class="module-icon">${icon}</div>
                <h3>${title}</h3>
                <p>${desc}</p>
                ${link ? `<a href="${link}" class="module-btn">Go to ${title}</a>` : ''}
            `;
            container.appendChild(card);
        }

        // Load categories into dropdown
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                const categories = await res.json();
                const dropdown = document.getElementById('categoriesDropdown');
                dropdown.innerHTML = '';
                categories.forEach(cat => {
                    const a = document.createElement('a');
					a.href = `/category.html?slug=${cat.slug}`;                    a.textContent = cat.name;
                    dropdown.appendChild(a);
                });
                if (categories.length === 0) {
                    dropdown.innerHTML = '<a href="#">No categories</a>';
                }
            } catch (err) {
                console.error('Error loading categories:', err);
            }
        }

        // Load dashboard data
        async function loadDashboard() {
            try {
                const userRes = await fetch('/api/user');
                if (!userRes.ok) {
                    if (userRes.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Failed to fetch user data');
                }
                const user = await userRes.json();

                document.getElementById('welcomeMessage').textContent = `Welcome back, ${user.full_name}!`;
                document.getElementById('userEmail').innerHTML = `<strong>Email:</strong> ${user.email}`;
                document.getElementById('roleBadge').textContent = user.role;
                document.getElementById('welcomeCard').style.display = 'block';

                const modules = modulesByRole[user.role] || modulesByRole.buyer;
                const container = document.getElementById('modulesContainer');
                container.innerHTML = '';
                modules.forEach(module => {
                    addModuleCard(module.icon, module.title, module.desc, module.link);
                });

                // If seller, add public store card
                if (user.role === 'seller') {
                    try {
                        const storeRes = await fetch('/api/seller/store');
                        if (storeRes.ok) {
                            const store = await storeRes.json();
                            addModuleCard('🏪', 'My Public Store', 'View your storefront as customers see it.', `/store.html?slug=${store.store_slug}`);
                        }
                    } catch (err) {
                        console.error('Error fetching store info:', err);
                    }
                }

                // If buyer, check seller application
                if (user.role === 'buyer') {
                    try {
                        const appRes = await fetch('/api/seller/application');
                        if (appRes.ok) {
                            const appData = await appRes.json();
                            if (!appData) {
                                addModuleCard('🏪', 'Become a Seller', 'Start selling your products.', '/seller-apply.html');
                            } else if (appData.status === 'pending') {
                                addModuleCard('⏳', 'Application Pending', 'Your seller application is under review.');
                            }
                        }
                    } catch (err) {
                        console.error('Error fetching seller application:', err);
                    }
                }

                document.getElementById('loading').style.display = 'none';
                container.style.display = 'grid';

            } catch (error) {
                console.error('Dashboard error:', error);
                document.getElementById('loading').innerHTML = '<div class="error-message">Error loading dashboard. Please refresh.</div>';
            }
        }

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        // Initialise
        loadCategories();
        loadDashboard();
    </script>
</body>
</html>
