<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - MarketCore</title>
    <link rel="icon" href="marketcorelogo.png" type="image/png">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .confirmation-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            margin: 2rem;
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 1rem;
        }
        .order-number {
            font-size: 1.5rem;
            background: #e7f3ff;
            padding: 1rem;
            border-radius: 8px;
            margin: 2rem 0;
            font-weight: 600;
            color: #1e3c72;
        }
        p {
            color: #666;
            margin-bottom: 2rem;
        }
        .btn {
            background: #1e3c72;
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #0b5e7c;
        }
    </style>
</head>
<body>
    <div class="confirmation-card">
        <h1>Thank You for Your Order!</h1>
        <p>Your order has been placed successfully.</p>
        <div class="order-number" id="orderNumber"></div>
        <p>We'll send you a confirmation email once your order ships.</p>
        <a href="/products.html" class="btn">Continue Shopping</a>
        <a href="/dashboard" class="btn" style="background:#6c757d; margin-left:1rem;">Go to Dashboard</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderNumber = urlParams.get('orderNumber');
        document.getElementById('orderNumber').textContent = orderNumber || 'N/A';
    </script>
</body>
</html>
